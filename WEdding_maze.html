<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Help Dhwani &amp; Arnesh find their way to the wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5e9dd;
  --ink: #34370f;
  --ink-soft: #5d6128;
  --olive: #8a9a39;
  --marigold: #f3b31f;
  --marigold-ink: #33340f;
  --crimson: #c21f34;
  --panel: #fff8ee;
  --line: #c9b88f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b12;
    --ink: #f4ead8;
    --ink-soft: #cdc29f;
    --panel: #2a281a;
    --line: #5b5635;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b12;
  --ink: #f4ead8;
  --ink-soft: #cdc29f;
  --panel: #2a281a;
  --line: #5b5635;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  font-weight: 500;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 940px;
  margin: 0 auto;
  padding: 10px 12px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.stage {
  position: relative;
  width: min(100%, 900px, calc((100vh - 130px) * 1.0014));
  width: min(100%, 900px, calc((100dvh - 130px) * 1.0014));
  min-width: 260px;
  aspect-ratio: 1442 / 1440;
  background: #f5e9dd;
  border-radius: 22px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: grab;
}
.stage.dragging { cursor: grabbing; }
.stage:focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }
.stage img, .stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  -webkit-user-drag: none;
}
.win {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(84%, 380px);
  padding: 20px 22px 22px;
  text-align: center;
  background: #fff8ee;
  color: #34370f;
  border: 3px solid #8a9a39;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(52, 55, 15, .28);
}
.win[hidden] { display: none; }
.toast {
  position: absolute;
  left: 50%;
  top: 4%;
  transform: translateX(-50%);
  max-width: 88%;
  padding: 9px 20px 10px;
  text-align: center;
  background: #c21f34;
  color: #fff8ee;
  border: 3px solid #fff8ee;
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(52, 14, 20, .35);
  pointer-events: none;
  z-index: 3;
  animation: pop .32s cubic-bezier(.2, 1.4, .4, 1) both;
}
.toast[hidden] { display: none; }
.toast.info {
  background: #f3b31f;
  color: #33340f;
  max-width: min(88%, 430px);
  padding: 11px 22px 12px;
}
.toast.info span { margin: 0; font-size: clamp(1rem, 3.9vw, 1.28rem); line-height: 1.22; font-weight: 700; }
.toast strong { display: block; font-size: clamp(1.15rem, 4.6vw, 1.55rem); line-height: 1.1; font-weight: 700; }
.toast span { display: block; font-size: clamp(.9rem, 3.3vw, 1.05rem); margin-top: 2px; }
@keyframes pop { from { transform: translateX(-50%) scale(.6) rotate(-3deg); opacity: 0; } to { transform: translateX(-50%) scale(1) rotate(0); opacity: 1; } }
.win h2 { margin: 0 0 4px; font-size: clamp(1.25rem, 4.6vw, 1.75rem); line-height: 1.15; font-weight: 700; color: #3f5fae; }
.win p { margin: 0 0 14px; font-size: 1rem; }
.bar {
  width: min(100%, 900px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
}
#msg { margin: 0; flex: 1 1 280px; font-size: 1.08rem; min-height: 1.45em; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit;
  font-weight: 700;
  font-size: .98rem;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--olive);
  border-radius: 999px;
  padding: 6px 16px;
  min-height: 42px;
  cursor: pointer;
}
button:hover { background: rgba(138, 154, 57, .16); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
button.primary { background: var(--marigold); border-color: var(--marigold); color: var(--marigold-ink); }
button.primary:hover { background: #ffc43d; }
.win button { color: #34370f; }
@media (max-width: 520px) {
  .wrap { padding: 6px 8px 14px; }
  .stage { border-radius: 16px; }
  .btns { width: 100%; }
  .btns button { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: reduce) {
  button:active { transform: none; }
  .toast { animation: none; }
}
</style>
</head>

/* Local path-aware steering: the heart moves to the reachable spot (within a small window)
   that is closest to the pointer. It can round bends, but cannot solve the maze from afar. */
function createEngine(walk, W, H){
  var R = 100, S = 2*R+1;
  var par = new Int32Array(S*S), queue = new Int32Array(S*S), seen = new Int32Array(S*S);
  var stamp = 0;
  var DX = [1,-1,0,0,1,1,-1,-1], DY = [0,0,1,-1,1,-1,1,-1];
  function isWalk(x,y){ x=Math.round(x); y=Math.round(y); return x>=0 && y>=0 && x<W && y<H && walk[y*W+x]===1; }
  function steer(px, py, tx, ty, maxStep){
    var cx = Math.round(px), cy = Math.round(py);
    if(!isWalk(cx,cy)) return {x:px, y:py, moved:false};
    var ox = cx-R, oy = cy-R;
    stamp++;
    var qh = 0, qt = 0, start = R*S+R;
    seen[start] = stamp; par[start] = -1; queue[qt++] = start;
    var best = start, bestD = (cx-tx)*(cx-tx)+(cy-ty)*(cy-ty);
    while(qh < qt){
      var cur = queue[qh++], ly = (cur/S)|0, lx = cur-ly*S;
      var gx = lx+ox, gy = ly+oy;
      var d = (gx-tx)*(gx-tx)+(gy-ty)*(gy-ty);
      if(d < bestD){ bestD = d; best = cur; }
      for(var k=0;k<8;k++){
        var nx = lx+DX[k], ny = ly+DY[k];
        if(nx<0||ny<0||nx>=S||ny>=S) continue;
        var ni = ny*S+nx;
        if(seen[ni]===stamp) continue;
        var gx2 = nx+ox, gy2 = ny+oy;
        if(gx2<0||gy2<0||gx2>=W||gy2>=H||walk[gy2*W+gx2]!==1) continue;
        seen[ni] = stamp; par[ni] = cur; queue[qt++] = ni;
      }
    }
    if(best === start) return {x:px, y:py, moved:false};
    var chain = [];
    for(var c = best; c !== -1; c = par[c]) chain.push(c);
    chain.reverse();
    var idx = Math.min(chain.length-1, Math.max(1, Math.round(maxStep)));
    var t = chain[idx], tly = (t/S)|0, tlx = t-tly*S;
    return {x: tlx+ox, y: tly+oy, moved:true};
  }
  return {steer:steer, isWalk:isWalk};
}

  var portaled = false, done = false, dragging = false, pid = null, started = false;
  var ptr = { x: 0, y: 0 };
  var keys = { left: false, right: false, up: false, down: false };
  var portal = null;         // {t0, phase}
  var tokenScale = 1;
  var rings = [], petals = [];
  var routeOn = false, routeFrac = 0;
  var clock = performance.now();   // single time source, updated once per frame
  var winTimer = null, toastTimer = null;
  var inBad = false, lastToast = -99999, anchor = null, lockUntil = 0;
  var MESSAGES = {
    temple: "Close, but no cigar - it's not quite the right mandap!",
    tools: "Great job collecting your tools of the trade but you haven't reached the Mandap yet!"
  };
  var armed = { temple: true, tools: true };

  function say(t) { msgEl.textContent = t; }
  function dist(a, b) { return Math.hypot(a.x - b[0], a.y - b[1]); }
  function uiScale() { return stageEl.getBoundingClientRect().width / W; }
  function toInternal(e) {
    var r = stageEl.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  /* ---------- load the walkable map ---------- */
  var mi = new Image();
  mi.onload = function () {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(mi, 0, 0);
    var d = cx.getImageData(0, 0, W, H).data;
    var w = new Uint8Array(W * H);
    bad = new Uint8Array(W * H);
    for (var i = 0; i < w.length; i++) {
      var v = d[i * 4];
      w[i] = v > 50 ? 1 : 0;      // walkable
      bad[i] = v > 150 ? 1 : 0;   // walkable, but a dead end / wrong way
    }
    engine = createEngine(w, W, H);
    ready = true;
    say(INTRO);
  };
  mi.onerror = function () { say('The map did not load. Please refresh the page.'); };
  mi.src = MASK_URI;

  /* ---------- trail ---------- */
  function addTrail(x, y) {
    if (lastTrail === null) lastTrail = { x: pos.x, y: pos.y };
    tctx.beginPath();
    tctx.moveTo(lastTrail.x, lastTrail.y);
    tctx.lineTo(x, y);
    tctx.stroke();
    lastTrail = { x: x, y: y };
  }

  /* ---------- stages, portal, win ---------- */
  function stageNow() {
    if (done) return 3;
    if (!portaled) return 0;
    if (pos.y > 790) return 1;
    if (pos.y > 500) return 2;
    return 3;
  }
  function addRing(x, y, color, dur, maxR) {
    if (reduce) return;
    rings.push({ x: x, y: y, t0: clock, dur: dur || 700, color: color || '#f3b31f', maxR: maxR || 70 });
  }
  function hideToast() { clearTimeout(toastTimer); toastEl.hidden = true; }
  function showInfo(key, now) {
    lastToast = now; lockUntil = now + 3200;
    toastEl.className = 'toast info';
    toastEl.innerHTML = '<span></span>';
    toastEl.firstChild.textContent = MESSAGES[key];
    toastEl.hidden = false;
    toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = '';
    say(MESSAGES[key]);
    addRing(pos.x, pos.y, '#f3b31f', 800, 78);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 4600);
  }
  function showWrong(kind, now) {
    if (now - lastToast < 1300 || now < lockUntil) return;
    lastToast = now;
    toastEl.className = 'toast';
    var sub = kind === 'dead' ? 'That path is a dead end. Turn back.' : 'Something is blocking the way.';
    toastEl.innerHTML = '<strong>Wrong way!</strong><span>' + sub + '</span>';
    toastEl.hidden = false;
    // restart the pop-in animation
    toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = '';
    say('Wrong way! ' + sub);
    addRing(pos.x, pos.y, '#c21f34', 650, 62);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }
  function startPortal(now) {
    hideToast();
    dragging = false; pid = null; stageEl.classList.remove('dragging');
    portal = { t0: now, phase: 0 };
    addRing(G.hole[0], G.hole[1], '#f3b31f', 600, 60);
    say('Whoosh! Down the slide and out through the tunnel.');
  }
  function updatePortal(now) {
    var t = Math.max(0, now - portal.t0);
    if (portal.phase === 0) {
      tokenScale = Math.max(0, 1 - t / 500);
      if (t >= 500) {
        portal.phase = 1;
        pos.x = G.tunnel[0]; pos.y = G.tunnel[1];
        portaled = true; lastTrail = null;
        addRing(pos.x, pos.y, '#f3b31f', 700, 70);
      }
    } else {
      var k = Math.max(0, Math.min(1, (t - 500) / 450));
      tokenScale = 1 - Math.pow(1 - k, 3);
      if (k >= 1) { portal = null; tokenScale = 1; }
    }
  }
  function spawnPetals(gx, gy) {
    var cols = ['#f3b31f', '#ef8a17', '#c21f34', '#fff3d6', '#f7c948'];
    for (var i = 0; i < 130; i++) {
      var fromBurst = i < 40;
      petals.push({
        x: fromBurst ? gx : Math.random() * W,
        y: fromBurst ? gy : -40 - Math.random() * 500,
        vx: fromBurst ? (Math.random() - 0.5) * 9 : (Math.random() - 0.5) * 1.6,
        vy: fromBurst ? -2 - Math.random() * 5 : 2 + Math.random() * 3.2,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.25,
        s: 9 + Math.random() * 10, c: cols[(Math.random() * cols.length) | 0], g: fromBurst ? 0.16 : 0
      });
    }
  }
  function win(g) {
    done = true; dragging = false; pid = null; stageEl.classList.remove('dragging');
    hideToast();
    say('You found the way to the wedding!');
    addRing(g[0], g[1], '#c21f34', 900, 90);
    if (!reduce) spawnPetals(g[0], g[1]);
    winTimer = setTimeout(function () { winEl.hidden = false; againBtn.focus({ preventScroll: true }); }, reduce ? 0 : 1100);
  }
  function checkTriggers(now) {
    var list = G.triggers || [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i], d = dist(pos, t.p);
      if (d < t.r && armed[t.key]) { armed[t.key] = false; showInfo(t.key, now); }
      else if (d > t.r + 45) armed[t.key] = true;
    }
  }
  function checkEvents(now) {
    if (!portaled && !portal && dist(pos, G.hole) < 14) startPortal(now);
    else if (portaled && !portal) {
      for (var i = 0; i < G.goals.length; i++) if (dist(pos, G.goals[i]) < 17) { win(G.goals[i]); break; }
      if (!done) checkTriggers(now);
    }
  }

  function reset() {
    clearTimeout(winTimer);
    tctx.clearRect(0, 0, W, H); styleTrail();
    pos = { x: G.start[0], y: G.start[1] };
    lastTrail = null; portaled = false; done = false; dragging = false; pid = null; started = false;
    portal = null; tokenScale = 1; rings = []; petals = [];
    inBad = false; anchor = null; lastToast = -99999; lockUntil = 0; armed = { temple: true, tools: true }; hideToast();
    routeOn = false; routeFrac = 0;
    routeBtn.textContent = 'Show the route'; routeBtn.setAttribute('aria-pressed', 'false');
    winEl.hidden = true; stageEl.classList.remove('dragging');
    say(ready ? INTRO : 'Loading the map…');
  }

  /* ---------- input ---------- */
  stageEl.addEventListener('pointerdown', function (e) {
    if (!ready || done || portal || pid !== null) return;
    if (e.target.closest && e.target.closest('.win')) return;
    var p = toInternal(e);
    var s = uiScale();
    var grab = Math.max(46, 38 / s);
    if (Math.hypot(p.x - pos.x, p.y - pos.y) <= grab) {
      dragging = true; pid = e.pointerId; ptr = p;
      try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
      stageEl.classList.add('dragging');
      e.preventDefault();
    } else {
      addRing(pos.x, pos.y, '#c21f34', 700, 60);
      if (!started) say('Pick up the heart by the couple, then drag it along the gold path.');
    }
  });
  stageEl.addEventListener('pointermove', function (e) {
    if (dragging && e.pointerId === pid) { ptr = toInternal(e); e.preventDefault(); }
  });
  function endDrag(e) {
    if (e.pointerId === pid) { dragging = false; pid = null; stageEl.classList.remove('dragging'); }
  }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);
  stageEl.addEventListener('lostpointercapture', endDrag);

  function keyDir(k) {
    switch (k) {
      case 'ArrowLeft': case 'a': case 'A': return 'left';
      case 'ArrowRight': case 'd': case 'D': return 'right';
      case 'ArrowUp': case 'w': case 'W': return 'up';
      case 'ArrowDown': case 's': case 'S': return 'down';
    }
    return null;
  }
  document.addEventListener('keydown', function (e) {
    var d = keyDir(e.key);
    if (!d || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    keys[d] = true; e.preventDefault();
  });
  document.addEventListener('keyup', function (e) {
    var d = keyDir(e.key);
    if (d) keys[d] = false;
  });
  window.addEventListener('blur', function () { keys.left = keys.right = keys.up = keys.down = false; });

  hintBtn.addEventListener('click', function () { say(HINTS[stageNow()]); });
  routeBtn.addEventListener('click', function () {
    routeOn = !routeOn;
    if (routeOn) routeFrac = reduce ? 1 : 0;
    routeBtn.textContent = routeOn ? 'Hide the route' : 'Show the route';
    routeBtn.setAttribute('aria-pressed', routeOn ? 'true' : 'false');
  });
  resetBtn.addEventListener('click', reset);
  againBtn.addEventListener('click', function () { reset(); stageEl.focus({ preventScroll: true }); });

  /* ---------- drawing ---------- */
  function polyLen(p) {
    var l = 0;
    for (var i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    return l;
  }
  var L1 = polyLen(G.route1), L2 = polyLen(G.route2), L3 = polyLen(G.route3);
  function strokePartial(p, maxLen) {
    ctx.beginPath();
    ctx.moveTo(p[0][0], p[0][1]);
    var acc = 0;
    for (var i = 1; i < p.length; i++) {
      var dx = p[i][0] - p[i - 1][0], dy = p[i][1] - p[i - 1][1], d = Math.hypot(dx, dy);
      if (acc + d >= maxLen) {
        var t = d === 0 ? 0 : (maxLen - acc) / d;
        ctx.lineTo(p[i - 1][0] + dx * t, p[i - 1][1] + dy * t);
        break;
      }
      ctx.lineTo(p[i][0], p[i][1]);
      acc += d;
    }
    ctx.stroke();
  }
  function drawRoute() {
    var upto = routeFrac * (L1 + L2 + L3);
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var pass = 0; pass < 2; pass++) {
      if (pass === 0) { ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 15; ctx.setLineDash([]); }
      else { ctx.strokeStyle = '#2f4fa8'; ctx.lineWidth = 7; ctx.setLineDash([15, 13]); }
      strokePartial(G.route1, Math.min(upto, L1));
      if (upto > L1) strokePartial(G.route2, Math.min(upto - L1, L2));
      if (upto > L1 + L2) strokePartial(G.route3, upto - L1 - L2);
    }
    ctx.restore();
  }
  function heartPath(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.95);
    ctx.bezierCurveTo(x - r * 1.7, y - r * 0.1, x - r * 0.95, y - r * 1.35, x, y - r * 0.45);
    ctx.bezierCurveTo(x + r * 0.95, y - r * 1.35, x + r * 1.7, y - r * 0.1, x, y + r * 0.95);
    ctx.closePath();
  }
  function drawToken(now) {
    if (tokenScale <= 0.01) return;
    var s = uiScale();
    var r = Math.max(13, 11 / s) * Math.max(0, tokenScale);
    if (!started && !done && !portal) {
      var pulse = reduce ? 0.5 : (Math.sin(now / 320) + 1) / 2;
      ctx.save();
      ctx.strokeStyle = 'rgba(194,31,52,' + (0.35 + 0.4 * (1 - pulse)) + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, Math.max(0, r * (1.7 + 0.7 * pulse)), 0, 6.283); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(pos.x, pos.y);
    if (portal && portal.phase === 0) ctx.rotate((now - portal.t0) / 70);
    ctx.translate(-pos.x, -pos.y);
    ctx.shadowColor = 'rgba(52,55,15,.45)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
    heartPath(pos.x, pos.y, r);
    ctx.fillStyle = '#c21f34'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = Math.max(3, r * 0.26); ctx.strokeStyle = '#fff6e6'; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();
  }
  function drawRings(now) {
    rings = rings.filter(function (g) { return now - g.t0 < g.dur; });
    ctx.save();
    rings.forEach(function (g) {
      var k = Math.max(0, Math.min(1, (now - g.t0) / g.dur));
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = g.color; ctx.lineWidth = 6 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, Math.max(0, g.maxR * (0.25 + 0.75 * k)), 0, 6.283); ctx.stroke();
    });
    ctx.restore();
  }
  function drawPetals() {
    petals = petals.filter(function (p) { return p.y < H + 40; });
    petals.forEach(function (p) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.g) p.vx *= 0.985;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    });
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    clock = now;
    var dt = Math.max(0, Math.min(40, now - last)); last = now;

    if (portal) updatePortal(now);

    if (ready && !done && !portal) {
      var tx = null, ty = 0, speed = 0.75 * dt, wantsMove = false, far = false;
      if (dragging) {
        tx = ptr.x; ty = ptr.y; wantsMove = true;
        far = Math.hypot(ptr.x - pos.x, ptr.y - pos.y) > 60;
      } else {
        var kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ky = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
        if (kx || ky) {
          var n = Math.hypot(kx, ky);
          tx = pos.x + kx / n * 40; ty = pos.y + ky / n * 40; speed *= 0.6;
          wantsMove = true; far = true;
        }
      }
      if (tx !== null) {
        var r = engine.steer(pos.x, pos.y, tx, ty, speed);
        if (r.moved) {
          if (!started) { started = true; say('Keep going. Press Hint if you get stuck.'); }
          addTrail(r.x, r.y);
          pos.x = r.x; pos.y = r.y;
          checkEvents(now);
          if (!done && !portal && bad) {
            var isBad = bad[Math.round(pos.y) * W + Math.round(pos.x)] === 1;
            if (isBad && !inBad) showWrong('dead', now);
            inBad = isBad;
          }
        }
      }
      // obstacle: the player keeps pushing but the heart is not getting anywhere
      if (wantsMove && far && !portal && !done) {
        if (!anchor || Math.hypot(pos.x - anchor.x, pos.y - anchor.y) > 12) anchor = { x: pos.x, y: pos.y, t: now };
        else if (now - anchor.t > 450) {
          showWrong(inBad ? 'dead' : 'block', now);
          anchor = { x: pos.x, y: pos.y, t: now };
        }
      } else anchor = null;
    }

    if (routeOn && routeFrac < 1) routeFrac = Math.min(1, routeFrac + dt / 3400);

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(trail, 0, 0);
    if (routeOn) drawRoute();
    drawRings(now);
    drawToken(now);
    if (petals.length) drawPetals();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
