<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero-cover" id="hero-cover">
  <div class="hero-overlay"></div>
  <nav class="site-nav">
    <a href="index.html" class="active">Home</a>
    <a href="our-story.html" id="nav-story">Our story</a>
    <a href="wedding-party.html" id="nav-party">Wedding party</a>
    <a href="faq.html" id="nav-faq">FAQs</a>
    <a href="rsvp.html" id="nav-rsvp">RSVP</a>
  </nav>
  <div class="hero-cover-content">
    <p class="hero-eyebrow" id="hero-eyebrow">You're invited</p>
    <h1 id="hero-title">Our Celebration</h1>
    <hr class="hero-rule">
    <div class="countdown" id="countdown">
      <div class="countdown-unit"><span class="countdown-num" id="cd-days">–</span><span class="countdown-label">Days</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cd-hours">–</span><span class="countdown-label">Hours</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cd-mins">–</span><span class="countdown-label">Minutes</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cd-secs">–</span><span class="countdown-label">Seconds</span></div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="lookup" id="lookup">
    <h2 id="lookup-heading">Find your invitation</h2>

    <div class="rsvp-field">
      <label id="group-prompt-label">Did you receive this link as part of a group?</label>
      <div class="rsvp-radios">
        <label><input type="radio" name="is-group" value="Yes"> Yes</label>
        <label><input type="radio" name="is-group" value="No"> No</label>
      </div>
    </div>

    <form id="lookup-form" class="rsvp-subform" style="display:none;">
      <div class="rsvp-field">
        <label for="code-input" id="code-label">Access code</label>
        <input type="text" id="code-input" placeholder="Access code" autocomplete="off" />
      </div>
      <button type="submit" class="btn">View</button>
    </form>

    <form id="group-form" class="rsvp-subform" style="display:none;">
      <div class="rsvp-field">
        <label for="group-select" id="group-name-label">Which group are you part of?</label>
        <select id="group-select"></select>
      </div>
      <div class="rsvp-field">
        <label for="first-name-input" id="first-name-label">First name</label>
        <input type="text" id="first-name-input" autocomplete="given-name">
      </div>
      <div class="rsvp-field">
        <label for="last-name-input" id="last-name-label">Last name</label>
        <input type="text" id="last-name-input" autocomplete="family-name">
      </div>
      <button type="submit" class="btn">Continue</button>
    </form>

    <p class="lookup-error" id="lookup-error"></p>
  </div>

  <div class="greeting" id="greeting">
    <p id="greeting-text"></p>
    <a class="btn rsvp-cta" id="rsvp-cta" href="rsvp.html">RSVP now</a>
  </div>

  <div class="invitation-embed" id="invitation-embed"></div>

  <div id="events"></div>

  <div class="empty-state" id="empty-state">
    <p>No events are attached to this invitation yet.</p>
  </div>

</div>

<footer id="site-footer">Made with care for the people we love.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="script.js"></script>
</body>
</html>
