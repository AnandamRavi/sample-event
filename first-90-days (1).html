HEADLINE | My first 90 days, | in three moves.

// ---------------------------- PHASE 1 ----------------------------
PHASE | Days 1–30 | Discover | Listen and Learn | 15, 60, 25

BOX | Read
- Domain-related concepts relevant to Caseware’s products
- Caseware’s Learning Value Chain (process flows, from needs analysis to deployment and measurement)
- Key players at every stage (internal and external)
- Success factors (client satisfaction scores and metrics)
- Tools, technology, LMS, etc.
- Standards, style guides, templates, formats and learning modalities

BOX | Listen
- Schedule get-to-know-you sessions (GTKYs) with instructional designers, media designers and technology teams
- Schedule GTKYs with the Head of Global Product Education and the VP of Professional Services
- Schedule meetings with the product team and other stakeholders

BOX | Reflect
- My place in the ecosystem
- KPIs
- My understanding of the stakeholders, processes, etc.

BOX | Outcome | outcome

  - Stakeholder map
  - Success factors for learning interventions

// ---------------------------- PHASE 2 ----------------------------
PHASE | Days 31–60 | Dive Deeper | Collaborate and Contribute | 25, 25, 50

BOX | Engage | columns

- Set up regular cadences with the Head of Global Product Education and product stakeholders to get direction on urgent, important and immediate business priorities, and validation on next steps
- Discuss what success looks like in my role with internal leadership, and my immediate focus areas
- Set up one-on-one meetings with team members to learn more about them: what works well, and any pain points
- Understand expectations, and what my success looks like from the team’s perspective, for their development and growth
- Go through and update individual development plans (IDPs) with each team member

BOX | Establish
- My credibility with the team, internal stakeholders and the product team, as a leader, manager and performance consultant
- My “seat at the table” at relevant discussions

BOX | Draft
- My IDP based on KPIs with success metrics, and team IDPs
- Bull’s-eye map of priorities, short-term and long-term
- Start drafting my understanding of the strategic curriculum map, combining the business priorities, the existing pipeline, and where I am expected to follow processes or propose updates

BOX | Outcome | outcome
- Draft strategy capability map
- IDPs (my own and the team’s)

// ---------------------------- PHASE 3 ----------------------------

PHASE | Days 61–90 | Draft & Develop | Identify Areas of Influence and Impact | 33, 33, 34

BOX | Reflect deeply
- My areas of impact within the strategic business priorities: what needs to stay as is, versus what can be improved, changed or updated
- My circles of influence: capabilities that exist, versus those that can be developed
- Leadership reports: what, how and when
- RACI matrices

BOX | Start developing
- My role as consultant and coach:
  - Within the ID team
  - Performance and learning coaching for stakeholders, to ensure optimum learning interventions and curriculum planning

BOX | Outcome | outcome

<style>

  /* spine: dashed track, filled with colour up to where you are */
  .phase::before{
    content:"";position:absolute;top:0;bottom:0;width:0;left:calc(var(--sx) - var(--pl) - 1px);
    border-left:2px dashed rgba(var(--accent-rgb),0.45);

  }
  /* the glowing head that travels down the spine as you scroll */
  .marker{
    position:absolute;top:0;left:var(--sx);width:14px;height:14px;border-radius:50%;z-index:2;pointer-events:none;

<script>
/* ==================== page code: no need to edit below ==================== */
(function(){
  var root = document.documentElement;
  root.classList.add('js');

  /* ---------- 1. read the plain-text CONTENT box ---------- */
  function parse(src){
    var d = { eyebrow:'', headA:'', headB:'', intro:'', phases:[] };
    var ph = null, box = null, last = null;
    src.split(/\r?\n/).forEach(function(raw){
      var line = raw.replace(/\s+$/, ''), t = line.trim();
      if (!t || t.indexOf('//') === 0) return;
      var m = /^(EYEBROW|HEADLINE|INTRO|PHASE|BOX)\s*\|\s*(.*)$/.exec(t);
      if (m){
        var parts = m[2].split('|').map(function(s){ return s.trim(); });
        last = null;
        if (m[1] === 'EYEBROW')  d.eyebrow = parts[0];
        if (m[1] === 'HEADLINE'){ d.headA = parts[0] || ''; d.headB = parts[1] || ''; }
        if (m[1] === 'INTRO')    d.intro = parts[0];
        if (m[1] === 'PHASE'){
          var mix = (parts[3] || '').split(',').map(function(x){ return parseFloat(x); });
          if (mix.length !== 3 || mix.some(function(x){ return isNaN(x); })) mix = null;
          ph = { days:parts[0]||'', name:parts[1]||'', sub:parts[2]||'', mix:mix, boxes:[] };
          d.phases.push(ph); box = null;
        }
        if (m[1] === 'BOX' && ph){
          var opts = (parts[1] || '').toLowerCase();
          box = { title:parts[0]||'', cols:/column/.test(opts), outcome:/outcome/.test(opts), items:[] };
          ph.boxes.push(box);
        }
        return;
      }
      if (!box) return;
      var indent = line.length - line.replace(/^\s+/, '').length;
      if (/^-\s+/.test(t)){
        var item = { text:t.replace(/^-\s+/, ''), kids:[] };
        if (indent >= 2 && box.items.length){
          box.items[box.items.length-1].kids.push(item);
        } else {
          box.items.push(item);
        }
        last = item;
      } else if (last){
        last.text += ' ' + t;          // continuation of the previous bullet
      }
    });
    return d;
  }

  /* ---------- 2. build the page from it ---------- */
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var DOODLES = [
    '<circle cx="20" cy="20" r="12"/><path d="M29 29 L42 42"/><path d="M13 18 a8 8 0 0 1 6-6"/>',
    '<circle cx="17" cy="24" r="12"/><circle cx="31" cy="24" r="12"/>',
    '<path d="M8 41 L10 31 L32 9 L39 16 L17 38 Z"/><path d="M28 13 L35 20"/><path d="M8 41 L17 38"/>'
  ];
  var MIXNAMES = [['People','People Developer','people'],['Business','Business Developer','business'],['Value','Value Creator','value']];

  function list(items, cls){
    var ol = el('ol', 'steps' + (cls ? ' ' + cls : ''));
    items.forEach(function(it){
      var li = el('li'); li.appendChild(document.createTextNode(it.text));
      if (it.kids.length) li.appendChild(list(it.kids, 'alpha'));
      ol.appendChild(li);
    });
    return ol;
  }

  var data = parse(document.getElementById('content').textContent);
  document.getElementById('eyebrow').textContent = data.eyebrow;
  var h1 = document.getElementById('headline');
  h1.appendChild(document.createTextNode(data.headA + ' '));
  if (data.headB){
    var hl = el('span', 'hl underline-draw'); hl.appendChild(document.createTextNode(data.headB));
    hl.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 60 2, 120 14, 180 6 S 280 4, 298 8"/></svg>');
    h1.appendChild(hl);
  }
  document.getElementById('intro').textContent = data.intro;

  var tl = document.getElementById('timeline');
  var pillBox = document.getElementById('pills');

  data.phases.forEach(function(p, i){
    var art = el('article', 'phase p' + ((i % 3) + 1));
    art.id = 'phase-' + (i + 1);
    var node = el('div', 'node'); node.appendChild(el('span', null, String(i + 1)));
    art.appendChild(node);
    art.appendChild(el('span', 'fill'));

    var head = el('div', 'phase-head');
    var h2 = el('h2', 'phase-title');
    var btn = el('button', 'phase-toggle');
    btn.type = 'button'; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', 'body-' + (i + 1));
    btn.appendChild(el('span', 'days', p.days));
    btn.appendChild(el('span', 'name', p.name));
    btn.appendChild(el('span', 'sub', p.sub));
    var chev = el('span', 'chev'); chev.setAttribute('aria-hidden', 'true'); btn.appendChild(chev);
    h2.appendChild(btn); head.appendChild(h2);
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'doodle'); svg.setAttribute('viewBox', '0 0 48 48'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = DOODLES[i % DOODLES.length];
    head.appendChild(svg);
    art.appendChild(head);

    var body = el('div', 'phase-body'); body.id = 'body-' + (i + 1);
    var inner = el('div', 'phase-body-inner');

    if (p.mix){
      var mb = el('div', 'mixbox reveal');
      mb.appendChild(el('span', 'mix-label', 'Where my time goes in this phase'));
      var bar = el('div', 'mix'); bar.setAttribute('role', 'img');
      var aria = [];
      p.mix.forEach(function(v, k){
        aria.push(MIXNAMES[k][1] + ' ' + v + ' percent');
        if (v <= 0) return;
        var seg = el('span', 'seg ' + MIXNAMES[k][2]); seg.style.flex = String(v);
        seg.appendChild(el('span', 'full', MIXNAMES[k][0] + '\u00a0'));
        seg.appendChild(document.createTextNode(v + '%'));
        bar.appendChild(seg);
      });
      bar.setAttribute('aria-label', aria.join(', '));
      mb.appendChild(bar);
      var lg = el('div', 'mix-legend'); lg.setAttribute('aria-hidden', 'true');
      MIXNAMES.forEach(function(n){ var s = el('span', n[2]); s.appendChild(el('i')); s.appendChild(document.createTextNode(n[1])); lg.appendChild(s); });
      mb.appendChild(lg);
      inner.appendChild(mb);
    }
    p.boxes.forEach(function(b){
      var bx = el('div', 'block reveal' + (b.outcome ? ' outcome' : ''));
      bx.appendChild(el('h3', null, b.title));
      bx.appendChild(list(b.items, b.cols ? 'cols' : ''));
      inner.appendChild(bx);
    });
    body.appendChild(inner); art.appendChild(body);
    tl.appendChild(art);

    var pill = el('button', 'pill c' + ((i % 3) + 1), (i + 1) + ' · ' + p.name);
    pill.type = 'button'; pillBox.appendChild(pill);
  });

  /* ---------- 3. scroll behaviour ---------- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var phases  = [].slice.call(tl.querySelectorAll('.phase'));
  var heads   = phases.map(function(p){ return p.querySelector('.phase-head'); });
  var toggles = phases.map(function(p){ return p.querySelector('.phase-toggle'); });
  var nodes   = phases.map(function(p){ return p.querySelector('.node'); });
  var pills   = [].slice.call(pillBox.querySelectorAll('.pill'));
  var marker  = document.getElementById('marker');
  var dayread = document.getElementById('dayread');
  var N = phases.length, DUR = 650;
  var ACC = [['#8fb9d6','143,185,214'],['#e8c468','232,196,104'],['#e2725b','226,114,91']];

  var active = -1;      // -1 = everything folded (the opening view)
  var busy = false, lock = false, lockTimer;

  [].forEach.call(tl.querySelectorAll('.reveal'), function(r){
    [].forEach.call(r.querySelectorAll('li'), function(li, i){ li.style.setProperty('--i', i); });
  });

  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting && e.intersectionRatio >= 0.1){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold:[0, 0.1, 0.25], rootMargin:'0px 0px -8% 0px' }) : null;

  function arm(i, on){            // boxes re-play their entrance each time a phase opens
    [].forEach.call(phases[i].querySelectorAll('.reveal'), function(el){
      if (on){ el.classList.remove('in'); if (io) io.observe(el); else el.classList.add('in'); }
      else   { if (io) io.unobserve(el); el.classList.remove('in'); }
    });
  }

  function paint(){
    phases.forEach(function(p, i){
      var open = i === active;
      var wasOpen = p.classList.contains('is-open');
      p.classList.toggle('is-open', open);
      p.classList.toggle('is-active', open);
      p.classList.toggle('is-done', i < active);
      p.classList.toggle('is-upcoming', i > active);
      toggles[i].setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open && !wasOpen) arm(i, true);
      if (!open && wasOpen) arm(i, false);
    });
    pills.forEach(function(b, i){ b.classList.toggle('on', i === active); });
  }

  // The "reading line": where the presenter is looking. It starts at the first
  // node (so the page opens at Day 1) and settles at 45% of the screen height.
  function readLine(){
    var n0 = nodes[0].getBoundingClientRect();
    return Math.min(window.innerHeight * 0.45, n0.top + window.scrollY + n0.height / 2);
  }

  function clamp(v, a, b){ return Math.min(Math.max(v, a), b); }

  // The marker, the coloured spine, the nav progress bars and the day counter
  function progress(){
    var tr = tl.getBoundingClientRect();
    var trig = readLine();
    var n0 = nodes[0].getBoundingClientRect();
    var first = n0.top + n0.height / 2 - tr.top;
    var end = phases[N-1].getBoundingClientRect().bottom - tr.top - 22;
    var y = clamp(trig - tr.top, first, Math.max(first, end));
    marker.style.setProperty('--my', y + 'px');
    var cur = 0, curF = 0;
    phases.forEach(function(p, i){
      var r = p.getBoundingClientRect(), top = r.top - tr.top;
      p.style.setProperty('--fill', clamp((y - top) / r.height, 0, 1).toFixed(4));
      var nr = nodes[i].getBoundingClientRect(), s = nr.top + nr.height / 2 - tr.top;
      var pf = clamp((y - s) / Math.max(1, (top + r.height - 22) - s), 0, 1);
      pills[i].style.setProperty('--pf', pf.toFixed(3));
      if (y >= s - 1){ cur = i; curF = pf; }
    });
    var a = ACC[cur % 3];
    marker.style.setProperty('--ma', a[0]); marker.style.setProperty('--mrgb', a[1]);
    var per = 90 / N;
    dayread.textContent = 'Day ' + Math.round(per * cur + 1 + curF * (per - 1)) + ' of 90';
    marker.classList.add('ready');
  }

  // Open one phase, fold the others. While heights animate we nudge scroll every
  // frame so the header you are looking at stays exactly where it is.
  function activate(idx, instant){
    if (idx === active) return;
    var prev = active;
    var anchor = heads[Math.max(prev, idx)];
    function docY(){ return anchor.getBoundingClientRect().top + window.scrollY; }
    var last = docY();
    var still = instant || reduce;
    if (still) tl.classList.add('no-anim');
    active = idx; paint();
    if (still){
      var d0 = docY() - last;
      if (d0) window.scrollBy({ top:d0, behavior:'instant' });
      requestAnimationFrame(function(){ tl.classList.remove('no-anim'); progress(); });
      progress();
      return;
    }
    busy = true;
    var t0 = performance.now();
    (function tick(now){
      var d = docY() - last;
      if (d) window.scrollBy({ top:d, behavior:'instant' });
      last = docY();
      progress();
      if (now - t0 < DUR + 120) requestAnimationFrame(tick);
      else { busy = false; detect(); }
    })(t0);
  }

  function detect(){
    if (busy || lock) return;
    var trig = readLine(), idx = -1;
    if (window.scrollY >= 60){
      nodes.forEach(function(n, i){ var r = n.getBoundingClientRect(); if (r.top + r.height / 2 <= trig + 1) idx = i; });
    }
    idx = Math.min(idx, active + 1);        // never skip a phase: open them in order
    if (idx !== active) activate(idx, false);
  }

  var ticking = false;
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(function(){ ticking = false; detect(); progress(); });
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);

  function goTo(i){
    clearTimeout(lockTimer); lock = true;
    activate(i, true);
    requestAnimationFrame(function(){
      var y = heads[i].getBoundingClientRect().top + window.scrollY - 84;
      window.scrollTo({ top:Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' });
      lockTimer = setTimeout(function(){ lock = false; detect(); progress(); }, 1000);
    });
  }
  toggles.forEach(function(b, i){ b.addEventListener('click', function(){ goTo(i); }); });
  pills.forEach(function(b, i){ b.addEventListener('click', function(){ goTo(i); }); });

  paint(); progress();
  window.addEventListener('load', progress);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(progress);
})();
</script>
</body>
</html>
